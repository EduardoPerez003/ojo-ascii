<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ojo ASCII</title>
<style>
:root{--bg:#f3ede5;--fg:#2b1b11;--mu:#7a6554;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a08;--fg:#f0e2d2;--mu:#a08c78}}
:root[data-theme="dark"]{--bg:#0e0a08;--fg:#f0e2d2;--mu:#a08c78}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;box-sizing:border-box;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#w{width:min(100%,920px)}
canvas{display:block;border-radius:14px;background:#0a0605}
p{margin:0;text-align:center;font-size:14px;color:var(--mu)}
</style></head><body>
<div id="w"><canvas id="c"></canvas></div>
<p>Mueve el ratón o el dedo y el ojo te sigue. Toca para que parpadee.</p>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const COLS=110,ROWS=56,L=14,A=ROWS/(COLS*.6);
const RAMP=" .'`,:;-~+=*zxvuncoXYUJCLQ0OZmwqpdbkhaMW#&8%B@$";
const jit=new Float32Array(COLS*ROWS);
for(let k=0;k<jit.length;k++){let v=(Math.sin(k*12.9898)*43758.5453)%1;jit[k]=v<0?v+1:v}
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const ramp=(s,t)=>{const n=s.length-1,p=Math.min(.999,t)*n,i=p|0;return mix(s[i],s[i+1],p-i)};
const S0=[[22,18,16],[70,60,54],[150,138,126],[226,216,204]];
const S1=[[24,8,4],[120,48,16],[232,120,36],[255,214,150]];
const PAL=[S0,S1].map(s=>Array.from({length:L},(_,l)=>`rgb(${ramp(s,l/(L-1)).map(Math.round)})`));
PAL.push(Array(L).fill('rgb(255,248,236)'));
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
let cw,ch,fs;
function size(){const w=Math.min(C.parentNode.clientWidth,920),d=window.devicePixelRatio||1;
fs=w/(COLS*.6);cw=w/COLS;ch=fs;C.width=Math.round(w*d);C.height=Math.round(ROWS*ch*d);
C.style.width=w+'px';C.style.height=ROWS*ch+'px';X.setTransform(d,0,0,d,0,0);
X.font=fs+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';X.textAlign='center';X.textBaseline='middle'}
size();addEventListener('resize',size);
let px=0,py=0,lastMove=-1e5,gx=0,gy=0,blinkAt=2,blinkT=-1,last=0;
addEventListener('pointermove',e=>{const r=C.getBoundingClientRect();
px=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(innerWidth/2)));
py=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(innerHeight/2)));lastMove=performance.now()});
addEventListener('pointerdown',()=>{if(blinkT<0)blinkT=0});
const B=Array.from({length:PAL.length*L},()=>[]);
function frame(ms){requestAnimationFrame(frame);if(ms-last<33)return;last=ms;const t=ms/1000;
const wander=ms-lastMove>4000;
gx+=((wander?.55*Math.sin(t*.5):px*.34)-gx)*.18;
gy+=((wander?.3*Math.sin(t*.37+1):py*.2)-gy)*.18;
if(blinkT<0&&t>blinkAt)blinkT=0;
let o=1;
if(blinkT>=0){blinkT+=.033;const k=blinkT/.26;if(k>=1){blinkT=-1;blinkAt=t+2.5+Math.random()*4}else o=Math.max(.03,1-Math.sin(k*Math.PI))}
for(const q of B)q.length=0;
const rp=.105+.018*Math.sin(t*.9),ri=.3,WE=.8;
for(let j=0;j<ROWS;j++){const y=((j+.5)/ROWS*2-1)*A;
for(let i=0;i<COLS;i++){const x=(i+.5)/COLS*2-1,n=jit[j*COLS+i];
let b,tone=0;
const ax=Math.abs(x)/WE,shape=ax<1?Math.pow(1-ax*ax,.8):0;
const yU=.4*o*shape,yL=.34*shape;
const vig=1-sm(.55,1.1,Math.hypot(x*.95,y*1.25));
if(shape>0&&y>-yU&&y<yL){
const dx=x-gx,dy=y-gy,d=Math.hypot(dx,dy),ld=Math.min(y+yU,yL-y);
if(d<rp){b=.05+.1*n;tone=1}
else if(d<ri){const a=Math.atan2(dy,dx),f=.5+.5*Math.sin(a*26+3*Math.sin(a*5+t*.3)+d*16),u=(d-rp)/(ri-rp);
b=(.3+.6*f)*(1-.5*u)+.35*Math.exp(-Math.pow((d-rp*1.9)/.025,2));
b*=1-.8*sm(.8,1,u);tone=1}
else b=(.62-.4*ax*ax)*(.55+.45*sm(ri,ri+.07,d));
b*=.35+.65*sm(0,.09,ld);
if(ld<.025){b=.9;tone=0}
if(Math.hypot(dx+.07,dy+.08)<.035){b=1;tone=2}
else if(Math.hypot(dx-.08,dy-.07)<.02){b=.85;tone=2}
}else b=.16+.16*n+(Math.abs(x)<.7?.28*Math.exp(-Math.pow((y+.6-.1*x*x)/.05,2)):0);
b*=vig;
if(b<.05)continue;
b=Math.min(1,b);
B[tone*L+Math.min(L-1,(b*L)|0)].push(i,j,Math.min(RAMP.length-1,Math.max(1,(b*(RAMP.length-1)+n*4-2)|0)));
}}
X.fillStyle='#0a0605';X.fillRect(0,0,COLS*cw,ROWS*ch);
B.forEach((q,bi)=>{if(!q.length)return;X.fillStyle=PAL[(bi/L)|0][bi%L];
for(let m=0;m<q.length;m+=3)X.fillText(RAMP[q[m+2]],(q[m]+.5)*cw,(q[m+1]+.5)*ch)});
}
requestAnimationFrame(frame);
</script></body></html>
